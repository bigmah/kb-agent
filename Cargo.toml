# kb-agent — a workspace of libraries and the one command that drives them.
#
#   crates/pdf-extractor   PDF in, Markdown out, OCR included. No I/O policy,
#                          no CLI.
#   crates/agent           One LLM request with a fresh context, in each of the
#                          roles the knowledge base needs: summarize a document,
#                          judge whether it is relevant, answer from it alone,
#                          compare two points, merge them, answer from the
#                          distilled list. No I/O policy, no CLI.
#   crates/kb              A directory of documents as a knowledge base: the
#                          index by path, building it, and running a question
#                          through every source in it.
#   crates/kb-agent        the command anyone actually runs.
#
# Everything shared between them lives here so the manifests only have to say
# what makes them different.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bigmah/kb-agent"

[workspace.dependencies]
pdf-extractor = { path = "crates/pdf-extractor", version = "0.1.0" }
agent = { path = "crates/agent", version = "0.1.0" }
kb = { path = "crates/kb", version = "0.1.0" }

# OCR is not optional: a scanned PDF has no text layer, and the point of this
# library is that callers never have to know which kind they handed it. The
# `ocr` feature adds PDFium for page rendering and PP-OCRv6 Small on ONNX
# Runtime for recognition. Neither library is linked in — both are dlopen'd the
# first time a page actually needs OCR — so a text PDF pays nothing for their
# presence.
pdf-inspector = { version = "1.17.0", features = ["ocr"] }

# The LLM client behind `agent`. Default features carry reqwest + rustls, which
# is the whole HTTP stack; nothing here needs the websocket, pdf or image
# extras.
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }

tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "net", "macros"] }
# `buffer_unordered` is the whole of the fan-out: many requests in flight, a
# bounded number at a time, results as they land. Already in the tree via rig.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
walkdir = "2"

# The chat's prompt: line editing and a history file, nothing more. The
# default features add key-binding customization and a home-directory lookup
# this program has no use for.
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
# Ctrl-C as a flag the chat can read, so that it stops the command running
# and not the session.
ctrlc = "3"
